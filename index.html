<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Le SVG d'abord (net à toute taille), l'ICO en repli: certains vieux
         navigateurs et des agrégateurs vont chercher /favicon.ico sans même
         lire le HTML. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#3b6ef6" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#dbe4ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Clouduo</title>
  </head>
  <body>
    <!-- Bulles de verre qui ricochent lentement sur les bords. Hors de #root:
         visibles sur tous les écrans, connexion comprise, et pas redessinées
         au rythme de React. -->
    <div class="orb-layer" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
